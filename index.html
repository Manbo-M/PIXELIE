<!doctype html>
<html lang="ja">
<head>
<link rel="icon" type="image/png" href="IMG_2852.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"
content="PIXELIEは、ブラウザで簡単にドット絵を作成・保存できる無料・公告なしのピクセルアートエディタです。16x16、32x32、48x48に対応しています。">

<title>PIXELIE | 無料ドット絵・チェキデザイン作成ツール</title>
/*ver.2.0.1*/

<style>

:root{ 
  --bg:#eeeeee; 
  --panel:#ffffff; 
  --ink:#070707; 
  --canvas:min(43vw,420px) 
} 

*{ 
  box-sizing:border-box 
} 

html, 
body{ 
  margin:0; 
  padding:0 
} 

body{ 
  background:var(--bg); 
  color:var(--ink); 
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif 
} 

.app{ 
  min-height:100vh; 
  padding:16px 
} 

/* ===== 上部バー ===== */ 

.top{ 
  height:90px; 
  width:100%; 
  box-sizing:border-box; 
  display:flex; 
  align-items:center; 
  justify-content:space-between; 
  padding:0 50px; 
  color:#fefdfd; 
  background:rgb(44,44,44); 
  border-bottom:1px solid #ddd 
} 

.brand{
  font-family:"Nunito", sans-serif;
  font-weight:800;
  font-size:24px;
  letter-spacing:.08em;
}

/* ===== マンボウ ===== */

.brand-area{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0
}

.brand-logo{
  width:52px;
  height:52px;
  object-fit:contain;
  image-rendering:pixelated;
  flex:none
}

.actions{ 
  display:flex; 
  gap:7px 
} 

button, 
input{ 
  font:inherit 
} 

button{ 
  cursor:pointer 
} 

/* ===== ボタン ===== */ 

.btn, 
.tool, 
.size{ 
  border:1.5px solid var(--ink); 
  background:#fff; 
  border-radius:9px 
} 

.btn{ 
  padding:8px 13px 
} 

.icon{ 
  width:42px; 
  height:42px; 
  font-size:22px 
}
.icon:disabled{opacity:.4;cursor:not-allowed}

/* ===== 戻る・進む ===== */
.history-controls{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:6px;
  margin-top:12px
}
.history-controls .icon{
  width:auto;
  height:62px;
  padding:4px 2px;
  font-size:22px
}


/* ===== メインレイアウト ===== */ 

.layout{ 
  transform:translate(-20px,25px); 
  width:min(900px,100%); 
  margin:auto; 
  display:grid; 
  grid-template-columns:minmax(0,1fr) 320px; 
  gap:12px 
} 

/* ===== カード ===== */ 

.card{ 
  background:var(--panel); 
  border:1.5px solid var(--ink); 
  border-radius:15px; 
  padding:16px 
} 

/* ===== キャンバス ===== */ 

.stage-wrap{ 
  display:grid; 
  place-items:center; 
  padding:8px 0 17px 
} 

.stage{ 
  position:relative; 
  width:var(--canvas); 
  max-width:100%; 
  aspect-ratio:1; 
  border:2px solid var(--ink); 
  overflow:hidden; 
  touch-action:none; 
  background: 
    conic-gradient( 
      #e9e9e9 25%, 
      #fff 0 50%, 
      #e9e9e9 0 75%, 
      #fff 0 
    ) 0 0/20px 20px 
} 

#canvas, 
#grid{ 
  position:absolute; 
  inset:0; 
  width:100%; 
  height:100%; 
  image-rendering:pixelated 
} 

#canvas{ 
  touch-action:none; 
  display:block 
} 

#grid{ 
  pointer-events:none 
} 

/* ===== サイズ変更 ===== */ 

.sizes{ 
  display:flex; 
  justify-content:center; 
  gap:7px; 
  flex-wrap:wrap 
} 

.size{ 
  min-width:76px; 
  padding:8px; 
  font-weight:700 
} 

.size.active{ 
  background:#111; 
  color:#fff 
} 

.hint{ 
  text-align:center; 
  font-size:12px; 
  color:#777; 
  margin:9px 0 0 
} 

/* ===== タイトル ===== */ 

.title{ 
  font-size:14px; 
  font-weight:800; 
  margin-bottom:8px 
} 

/* ===== ツール ===== */ 

.tools{ 
  display:grid; 
  grid-template-columns:repeat(5,1fr); 
  gap:6px 
} 

.tool{ 
  min-height:62px; 
  padding:4px 2px; 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  justify-content:center; 
  gap:3px; 
  font-size:11px 
} 

.tool span:first-child{ 
  font-size:21px 
} 

.tool.active{ 
  background:#111; 
  color:#fff 
} 

/* ===== コントロール ===== */ 

.controls{ 
  width:100%; 
  min-width:0; 
  display:flex; 
  flex-direction:column; 
  gap:12px 
} 

/* ===== カラーピッカー ===== */ 

.colors{ 
  display:grid; 
  grid-template-columns:130px minmax(0,1fr); 
  gap:8px; 
  align-items:center 
} 

.picker{ 
  width:130px; 
  height:130px; 
  position:relative; 
  display:grid; 
  place-items:center 
} 

.ring{ 
  position:absolute; 
  inset:0; 
  border-radius:50%; 
  background: 
    conic-gradient( 
      red, 
      yellow, 
      lime, 
      cyan, 
      blue, 
      magenta, 
      red 
    ); 
  -webkit-mask: 
    radial-gradient( 
      farthest-side, 
      transparent calc(100% - 18px), 
      #000 calc(100% - 17px) 
    ); 
  mask: 
    radial-gradient( 
      farthest-side, 
      transparent calc(100% - 18px), 
      #000 calc(100% - 17px) 
    ) 
} 

.sv{ 
  width:82px; 
  height:82px; 
  border-radius:3px; 
  position:relative; 
  overflow:hidden; 
  background: 
    linear-gradient(to bottom,transparent,#000), 
    linear-gradient( 
      to right, 
      #fff, 
      hsl(var(--h),100%,50%) 
    ); 
  box-shadow:0 0 0 1.5px #222 
} 

.mark{ 
  position:absolute; 
  width:14px; 
  height:14px; 
  border:2px solid #fff; 
  border-radius:50%; 
  box-shadow:0 0 0 1px #111; 
  transform:translate(-50%,-50%); 
  pointer-events:none 
} 

/* ===== 色情報 ===== */ 

.side{ 
  display:flex; 
  flex-direction:column; 
  gap:9px 
} 

.current{ 
  display:flex; 
  align-items:center; 
  gap:8px 
} 

.preview{ 
  width:38px; 
  height:38px; 
  border:1.5px solid #222; 
  border-radius:7px 
} 

.hexrow{ 
  display:flex; 
  gap:6px 
} 

.hex{ 
  min-width:0; 
  flex:1; 
  border:1.5px solid #222; 
  border-radius:8px; 
  padding:9px 10px; 
  text-transform:uppercase 
} 

.plus{ 
  width:40px; 
  height:40px; 
  border:1.5px solid #222; 
  border-radius:50%; 
  background:#fff; 
  font-size:22px 
} 

.status{ 
  font-size:12px; 
  color:#666; 
  background:#f7f7f7; 
  border-radius:7px; 
  padding:7px 
} 

/* ===== パレット ===== */ 

.palette{ 
  display:grid; 
  grid-template-columns:repeat(10,1fr); 
  gap:4px; 
  border:1.5px solid #222; 
  border-radius:8px; 
  padding:6px; 
  background:#fafafa 
} 

.swatch{ 
  aspect-ratio:1; 
  border:1px solid #888; 
  border-radius:3px; 
  padding:0; 
  background: 
    repeating-conic-gradient( 
      #ddd 0 25%, 
      #fff 0 50% 
    ) 50%/10px 10px; 
  position:relative 
} 

.swatch i{ 
  position:absolute; 
  inset:0 
} 

.swatch.sel{ 
  outline:2px solid #111; 
  outline-offset:1px 
} 

.danger{ 
  border-color:#a33; 
  color:#8a2222 
} 

/* ===== モーダル ===== */ 

.modalbg{ 
  position:fixed; 
  inset:0; 
  background:#0007; 
  display:none; 
  align-items:center; 
  justify-content:center; 
  padding:20px; 
  z-index:10 
} 

.modalbg.show{ 
  display:flex 
} 

.modal{ 
  width:min(420px,100%); 
  background:#fff; 
  border:1.5px solid #222; 
  border-radius:13px; 
  padding:20px 
} 

.modal h2{ 
  font-size:18px; 
  margin:0 0 10px 
} 

.modal p{ 
  font-size:14px; 
  line-height:1.6 
} 

.modal-actions{ 
  text-align:right 
} 

.modal-actions button{ 
  padding:8px 14px; 
  border:1.5px solid #222; 
  border-radius:8px; 
  background:#fff; 
  margin-left:6px 
} 

.modal-actions .ok{ 
  background:#111; 
  color:#fff 
} 

/* ===== タブレット ===== */ 

@media(max-width:900px){ 

  :root{ 
    --canvas:min(76vw,520px) 
  } 

  .layout{ 
    transform:none; 
    width:100%; 
    grid-template-columns:1fr 
  } 

  .controls{ 
    order:2 
  } 
} 

/* ===== スマートフォン ===== */ 

@media(max-width:560px){ 

  .app{ 
    padding:9px 
  } 

  :root{ 
    --canvas:min(88vw,480px) 
  } 

  .card{ 
    padding:10px 
  } 

  .colors{ 
    grid-template-columns:1fr 
  } 

  .picker{ 
    margin:auto 
  } 

  .tool{ 
    min-height:57px 
  } 

  .tool span:first-child{ 
    font-size:18px 
  } 
}

/* ===== マンボウ用スマホ調整 ===== */
@media(max-width:560px){
  .top{
    padding:0 14px
  }
  .brand-area{
    gap:7px
  }
  .brand-logo{
    width:38px;
    height:38px
  }
  .brand{
    font-size:24px
  }
  .actions{
    gap:5px
  }
  .btn{
    padding:7px 9px
  }
  .icon{
    width:38px;
    height:38px
  }
}


/* ===== チェキ風プレビュー ===== */
.cheki-modal{
  width:min(760px,100%);
  max-height:calc(100vh - 32px);
  overflow:auto;
  background:#fff;
  border:1.5px solid #222;
  border-radius:15px;
  padding:18px
}
.cheki-layout{
  display:grid;
  grid-template-columns:minmax(280px,1fr) 260px;
  gap:18px;
  align-items:start
}
.cheki-preview-wrap{
  display:grid;
  place-items:center;
  background:#eee;
  border-radius:10px;
  padding:14px
}
#chekiPreview{
  width:min(100%,420px);
  height:auto;
  display:block;
  image-rendering:pixelated;
  background:#fff
}
.cheki-side{
  display:flex;
  flex-direction:column;
  gap:12px
}
.cheki-side h2{
  font-size:18px;
  margin:0
}
.cheki-note{
  font-size:12px;
  color:#666;
  line-height:1.6;
  margin:0
}
.used-colors{
  display:grid;
  grid-template-columns:repeat(5,minmax(62px,1fr));
  gap:8px;
  max-height:230px;
  overflow:auto;
  padding:4px 2px
}
.used-color-choice{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  min-width:0;
  padding:6px 4px;
  border:1.5px solid #bbb;
  border-radius:8px;
  background:#fff;
  cursor:pointer
}
.used-color-choice:hover{border-color:#555}
.used-color-choice.selected{border-color:#111;box-shadow:0 0 0 2px #111 inset}
.used-color-choice input{
  position:absolute;
  left:6px;
  top:6px;
  width:24px;
  height:24px;
  margin:0;
  accent-color:#111;
  cursor:pointer
}
.used-color-swatch{
  width:42px;
  height:42px;
  border:1.5px solid #555;
  border-radius:5px;
  margin-top:3px
}
.used-color-label{
  font-size:11px;
  font-weight:700;
  line-height:1.2;
  word-break:break-all;
  text-align:center
}
.cheki-actions{
  display:flex;
  gap:7px;
  justify-content:flex-end;
  flex-wrap:wrap
}
.cheki-actions button{
  padding:8px 12px;
  border:1.5px solid #222;
  border-radius:8px;
  background:#fff
}
.cheki-actions .ok{
  background:#111;
  color:#fff
}
.cheki-help{
  font-size:12px;
  color:#777;
  margin:0
}
@media(max-width:700px){
  .cheki-layout{
    grid-template-columns:1fr
  }
  .cheki-side{
    order:2
  }
}


.save-modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border:1.5px solid #222;border-radius:15px;padding:20px}
.save-modal h2{margin:0 0 14px;font-size:19px}
.save-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.save-option{padding:11px;border:1.5px solid #222;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}
.save-option.active{background:#111;color:#fff}
.save-cheki-settings{margin-top:16px;display:none}
.save-cheki-settings.show{display:block}
.cheki-date{width:100%;padding:10px 12px;border:1.5px solid #222;border-radius:8px;background:#fff}
.cheki-date-help{font-size:12px;color:#777;margin:5px 0 14px}
.save-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.save-modal-actions button{padding:9px 14px;border:1.5px solid #222;border-radius:8px;background:#fff}
.save-modal-actions .ok{background:#111;color:#fff}



.save-modal{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#fff;border:1.5px solid #222;border-radius:15px;padding:20px}
.save-modal h2{margin:0 0 14px;font-size:19px}
.save-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.save-option{padding:11px;border:1.5px solid #222;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}
.save-option.active{background:#111;color:#fff}
.save-cheki-settings{margin-top:16px;display:none}
.save-cheki-settings.show{display:block}
.cheki-date{width:100%;padding:10px 12px;border:1.5px solid #222;border-radius:8px;background:#fff}
.cheki-date-help{font-size:12px;color:#777;margin:5px 0 14px}
.save-modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.save-modal-actions button{padding:9px 14px;border:1.5px solid #222;border-radius:8px;background:#fff}
.save-modal-actions .ok{background:#111;color:#fff}




/* ===== 画像→ドット ===== */
#imageModal .modal{
  width:min(480px,100%);
}
#imageFile{
  border:1.5px solid #222;
  border-radius:8px;
  padding:8px;
  background:#fff;
}
#imageStatus{
  min-height:18px;
}
@media(max-width:560px){
  #imageModal .modal{
    padding:15px;
  }
}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand-area"><img class="brand-logo" src="IMG_2852.png" alt="マンボウ"><div class="brand">PIXELIE</div></div><div class="actions"><button class="btn icon" id="reload" title="サイト内の更新">↻</button><button class="btn" id="save">保存</button></div></header>
<main class="layout">
<section class="card">
<div class="stage-wrap"><div class="stage"><canvas id="canvas"></canvas><svg id="grid"></svg></div></div>
<div class="sizes" id="sizes"><button class="size active" data-size="16">16×16</button><button class="size" data-size="32">32×32</button><button class="size" data-size="48">48×48</button></div>
<div style="display:flex;justify-content:center;margin-top:10px">
  <button class="btn" id="imageImport">画像をドット化</button>
</div>
<p class="hint">キャンバスをドラッグして描画できます</p>
</section>
<aside class="card controls">
<section><div class="title">ツール</div><div class="tools" id="tools">
<button class="tool active" data-tool="pen"><span>✎</span>ペン</button><button class="tool" data-tool="eraser"><span>⌫</span>消しゴム</button><button class="tool" data-tool="eyedropper"><span>⌁</span>スポイト</button><button class="tool" data-tool="fill"><span>▰</span>塗りつぶし</button><button class="tool active" data-tool="grid"><span>▦</span>グリッド ON</button>
</div><div class="history-controls"><button class="btn icon" id="undo" title="一つ戻す">←</button><button class="btn icon" id="redo" title="一つ進む">→</button></div>
</section>
<section><div class="title">カラー</div><div class="colors"><div class="picker"><div class="ring" id="ring"></div><div class="sv" id="sv"><i class="mark" id="svmark"></i></div><i class="mark" id="humark"></i></div><div class="side"><div class="current"><i class="preview" id="preview"></i><b id="label">#ACDA95</b></div><div class="hexrow"><input class="hex" id="hex" value="#ACDA95" maxlength="7"><button class="plus" id="add">+</button></div><div class="status" id="status">ペンモード</div></div></div></section>
<section><div class="title">保存パレット（最大50色）</div><div class="palette" id="palette"></div></section>
<button class="btn danger" id="clear2">パレット全消去</button>
</aside>
</main>
</div>

<div class="modalbg" id="saveModal">
  <div class="save-modal">
    <h2>保存形式を選択</h2>
    <div class="save-options">
      <button class="save-option active" data-save-type="normal">通常PNG</button>
      <button class="save-option" data-save-type="cheki">チェキ風PNG</button>
    </div>
    <div class="save-cheki-settings" id="saveChekiSettings">
      <div class="title">日付を入力</div>
      <input class="cheki-date" id="chekiDate" type="date" aria-label="チェキに表示する日付">
      <p class="cheki-date-help">日付はチェキ風画像に表示されます。</p>
      <div class="title">使用色から最大5色を選択</div>
      <div class="used-colors" id="saveUsedColors"></div>
      <p class="cheki-help" id="saveColorStatus">選択：0 / 5色</p>
    </div>
    <div class="save-modal-actions">
      <button id="saveCancel">キャンセル</button>
      <button class="ok" id="saveExecute">保存</button>
    </div>
  </div>
</div>

<div class="modalbg" id="chekiModal">
  <div class="cheki-modal">
    <div class="cheki-layout">
      <div class="cheki-preview-wrap">
        <canvas id="chekiPreview" width="600" height="800"></canvas>
      </div>
      <div class="cheki-side">
        <h2>チェキ風プレビュー</h2>
        <p class="cheki-note">保存前にチェキ風の仕上がりを確認できます。</p>
        <div class="cheki-actions">
          <button id="chekiClose">プレビューを閉じる</button>
          <button class="ok" id="chekiSave">チェキ風PNGを保存</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modalbg" id="imageModal">
  <div class="modal">
    <h2>画像をドット化</h2>
    <p>画像を選択すると、正方形に自動調整して16×16 / 32×32 / 48×48のドット絵に変換します。</p>
    <input id="imageFile" type="file" accept="image/*" style="width:100%;margin:8px 0 12px">
    <div class="title">変換サイズ</div>
    <div class="sizes" id="imageSizes">
      <button class="size active" data-image-size="16">16×16</button>
      <button class="size" data-image-size="32">32×32</button>
      <button class="size" data-image-size="48">48×48</button>
    </div>
    <p id="imageStatus" style="font-size:12px;color:#777;margin:10px 0 0">画像を選択してください。</p>
    <div class="modal-actions" style="margin-top:14px">
      <button id="imageCancel">キャンセル</button>
      <button class="ok" id="imageExecute">ドット化して読み込む</button>
    </div>
  </div>
</div>
<div class="modalbg" id="modal"><div class="modal"><h2 id="mtitle">確認</h2><p id="mtext"></p><div class="modal-actions"><button id="cancel">いいえ</button><button class="ok" id="ok">はい</button></div></div></div>

<script>
(()=>{"use strict";
const MAX=50,SIZES=[16,32,48],s={size:16,tool:"pen",grid:true,color:"#ACDA95",h:0,sat:.38,val:.85,palette:Array(MAX).fill(null),drawing:false,last:null,chekiColors:[],chekiDate:""};

/* ===== Undo / Redo ===== */
const HISTORY_MAX=5;
const history=[];
const future=[];
function captureState(){return{size:s.size,image:x.getImageData(0,0,s.size,s.size)}}
function saveHistory(){history.push(captureState());if(history.length>HISTORY_MAX)history.shift();future.length=0;updateHistoryButtons()}

/* ===== 画像→ドット機能 ===== */
let imageImportSize = 16;
let imageSource = null;

function openImageImport(){
  $("imageModal").classList.add("show");
  $("imageFile").value = "";
  imageSource = null;
  imageImportSize = 16;
  document.querySelectorAll("[data-image-size]").forEach(b=>{
    b.classList.toggle("active", +b.dataset.imageSize === imageImportSize);
  });
  $("imageStatus").textContent = "画像を選択してください。";
}

function imageToPixelArt(img, n){
  // 画像の中央を正方形として切り出す
  const srcW = img.naturalWidth || img.width;
  const srcH = img.naturalHeight || img.height;
  const side = Math.min(srcW, srcH);
  const sx = (srcW - side) / 2;
  const sy = (srcH - side) / 2;

  const work = document.createElement("canvas");
  work.width = n;
  work.height = n;
  const ctx = work.getContext("2d", {willReadFrequently:true});
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(img, sx, sy, side, side, 0, 0, n, n);

  const data = ctx.getImageData(0,0,n,n).data;

  // 各ドットの代表色を取得。
  // 透明部分は透明のままにし、半透明は背景との混ざりを避けるため
  // アルファ値が最も高い色を優先する。
  const out = document.createElement("canvas");
  out.width = n;
  out.height = n;
  const ox = out.getContext("2d");
  ox.imageSmoothingEnabled = false;
  const outData = ox.createImageData(n,n);

  for(let y=0;y<n;y++){
    for(let x0=0;x0<n;x0++){
      const i=(y*n+x0)*4;
      outData.data[i]=data[i];
      outData.data[i+1]=data[i+1];
      outData.data[i+2]=data[i+2];
      outData.data[i+3]=data[i+3];
    }
  }
  ox.putImageData(outData,0,0);
  return out;
}

$("imageImport").onclick = openImageImport;

$("imageCancel").onclick = ()=>{
  $("imageModal").classList.remove("show");
};

document.querySelectorAll("[data-image-size]").forEach(btn=>{
  btn.onclick=()=>{
    imageImportSize=+btn.dataset.imageSize;
    document.querySelectorAll("[data-image-size]").forEach(b=>{
      b.classList.toggle("active", +b.dataset.imageSize === imageImportSize);
    });
  };
});

$("imageFile").onchange = e=>{
  const file=e.target.files?.[0];
  if(!file){
    imageSource=null;
    $("imageStatus").textContent="画像を選択してください。";
    return;
  }
  if(!file.type.startsWith("image/")){
    imageSource=null;
    $("imageStatus").textContent="画像ファイルを選択してください。";
    return;
  }

  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{
    imageSource=img;
    $("imageStatus").textContent=`選択中：${img.naturalWidth}×${img.naturalHeight}px`;
    URL.revokeObjectURL(url);
    log("画像読み込み",file.name);
  };
  img.onerror=()=>{
    imageSource=null;
    $("imageStatus").textContent="画像を読み込めませんでした。";
    URL.revokeObjectURL(url);
  };
  img.src=url;
};

$("imageExecute").onclick=()=>{
  if(!imageSource){
    $("imageStatus").textContent="先に画像を選択してください。";
    return;
  }

  try{
    const n=imageImportSize;
    const result=imageToPixelArt(imageSource,n);

    // 現在の作品を履歴へ保存してから置き換える
    saveHistory();

    s.size=n;
    c.width=c.height=n;
    x.imageSmoothingEnabled=false;
    x.clearRect(0,0,n,n);
    x.drawImage(result,0,0);

    grid();
    document.querySelectorAll(".size").forEach(b=>{
      b.classList.toggle("active",+b.dataset.size===n);
    });

    $("status").textContent=`画像を${n}×${n}のドット絵に変換しました`;
    log("画像→ドット",n+"×"+n);
    $("imageModal").classList.remove("show");
  }catch(err){
    console.error("[画像→ドット] 変換に失敗しました",err);
    $("imageStatus").textContent="変換に失敗しました。別の画像で試してください。";
    log("画像→ドットエラー",err.message||String(err));
  }
};

$("imageModal").addEventListener("click",e=>{
  if(e.target===$("imageModal"))$("imageModal").classList.remove("show");
});

/* ===== チェキ風機能 ===== */
function getUsedColors(){
  const d=x.getImageData(0,0,s.size,s.size).data,colors=[],seen=new Set();
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0)continue;
    const h=rgbhex(d[i],d[i+1],d[i+2]);
    if(!seen.has(h)){seen.add(h);colors.push(h)}
  }
  return colors
}



async function drawCheki(){
  const pc=$("chekiPreview");
  const ctx=pc.getContext("2d");
  ctx.imageSmoothingEnabled=false;
  ctx.clearRect(0,0,pc.width,pc.height);
  ctx.fillStyle="#fdfdfd";
  ctx.fillRect(0,0,600,800);
  ctx.strokeStyle="#222";
  ctx.lineWidth=2;
  ctx.strokeRect(1,1,598,798);

  // 元キャンバスを一度オフスクリーンへコピーしてから描画することで、
  // キャンバスサイズや表示倍率に左右されず作品を確実に反映する。
  const source=document.createElement("canvas");
  source.width=c.width;
  source.height=c.height;
  const sx=source.getContext("2d");
  sx.imageSmoothingEnabled=false;
  sx.clearRect(0,0,source.width,source.height);
  sx.drawImage(c,0,0);

  ctx.fillStyle="#eee";
  ctx.fillRect(40,40,520,520);
  ctx.drawImage(source,0,0,source.width,source.height,40,40,520,520);

  ctx.fillStyle="#111";
  ctx.font="bold 25px system-ui,sans-serif";
  ctx.fillText("Pixel Art_PIXELIE",40,615);
  ctx.font="18px system-ui,sans-serif";
  ctx.fillText(`${s.size} × ${s.size}`,40,648);
  if(s.chekiDate){
    const dateText=s.chekiDate.replace(/-/g,"/");
    ctx.font="18px system-ui,sans-serif";
    ctx.fillText(dateText,150,648);
  }

  ctx.font="bold 15px system-ui,sans-serif";
  ctx.fillText("COLORS",40,690);
  s.chekiColors.slice(0,5).forEach((col,i)=>{
    const xx=110+i*70;
    ctx.fillStyle=col;
    ctx.fillRect(xx,665,34,34);
    ctx.strokeStyle="#222";
    ctx.lineWidth=1;
    ctx.strokeRect(xx,665,34,34);
    ctx.fillStyle="#111";
    ctx.font="10px system-ui,sans-serif";
    ctx.fillText(col.toUpperCase(),xx-6,716);
  });

  // qr.png は fetch で取得して Blob URL から読み込む。
  // 読み込み完了を待ってからCanvasへ描画することで、
  // QR描画後の toDataURL() が SecurityError になる問題を回避する。
  try{
    const response=await fetch("qr.png",{cache:"no-store"});
    if(!response.ok)throw new Error(`HTTP ${response.status}`);
    const blob=await response.blob();
    const qrUrl=URL.createObjectURL(blob);
    try{
      const qrImage=new Image();
      await new Promise((resolve,reject)=>{
        qrImage.onload=resolve;
        qrImage.onerror=()=>reject(new Error("qr.png の画像読み込みに失敗しました"));
        qrImage.src=qrUrl;
      });
      ctx.drawImage(qrImage,500,650,75,75);
    }finally{
      URL.revokeObjectURL(qrUrl);
    }
  }catch(err){
    console.error("[チェキ風] qr.png の読み込みに失敗しました",err);
  }
}
function renderUsedColors(targetId="usedColors",statusId="chekiColorStatus"){
  const box=$(targetId),colors=getUsedColors();
  if(!box)return;
  box.innerHTML="";
  s.chekiColors=s.chekiColors.filter(v=>colors.includes(v)).slice(0,5);
  if(!colors.length){
    box.innerHTML='<div style="font-size:12px;color:#777;grid-column:1/-1">作品に使用されている色はありません</div>';
  }
  colors.forEach(col=>{
    const label=document.createElement("label");
    label.className="used-color-choice"+(s.chekiColors.includes(col)?" selected":"");
    const input=document.createElement("input");
    input.type="checkbox";
    input.checked=s.chekiColors.includes(col);
    input.setAttribute("aria-label",col.toUpperCase());
    const swatch=document.createElement("span");
    swatch.className="used-color-swatch";
    swatch.style.background=col;
    const code=document.createElement("span");
    code.className="used-color-label";
    code.textContent=col.toUpperCase();
    input.onchange=()=>{
      const idx=s.chekiColors.indexOf(col);
      if(input.checked){
        if(s.chekiColors.length>=5){
          input.checked=false;
          if($(statusId))$(statusId).textContent="最大5色まで選択できます";
          return;
        }
        s.chekiColors.push(col);
      }else if(idx>=0){
        s.chekiColors.splice(idx,1);
      }
      renderUsedColors(targetId,statusId);
      drawCheki();
    };
    label.appendChild(input);
    label.appendChild(swatch);
    label.appendChild(code);
    box.appendChild(label);
  });
  if($(statusId))$(statusId).textContent=`選択：${s.chekiColors.length} / 5色`;
}
$("save").onclick=()=>{
  s.chekiColors=getUsedColors().slice(0,5);
  const dateInput=$("chekiDate");

    }
    s.chekiDate=dateInput.value;
    await drawCheki(); $("saveModal").classList.remove("show"); $("chekiModal").classList.add("show");
    log("チェキ風プレビュー","表示");
  }
};

$("chekiClose").onclick=()=>{
  $("chekiModal").classList.remove("show");
  log("チェキ風プレビュー","閉じる")
};
$("chekiSave").onclick=()=>{
  try{
    const a=document.createElement("a");
    const filename=`pixel_art_${s.size}x${s.size}_cheki.png`;
    a.download=filename;
    a.href=$("chekiPreview").toDataURL("image/png");
    document.body.appendChild(a);
    a.click();
    a.remove();
    $("status").textContent="チェキ風PNGを保存しました";
    log("チェキ風保存",filename)
  }catch(err){
    console.error("[チェキ風保存] 失敗しました",err);
    $("status").textContent="チェキ風保存に失敗しました";
    log("チェキ風保存エラー",err.message||String(err))
  }
};
$("chekiModal").addEventListener("click",e=>{
  if(e.target===$("chekiModal"))$("chekiModal").classList.remove("show")
});
$("saveModal").addEventListener("click",e=>{
  if(e.target===$("saveModal"))$("saveModal").classList.remove("show")
});

$("undo").onclick=undo;$("redo").onclick=redo;init(16);setColor("#ACDA95");palette();updateHistoryButtons();log("起動","描画版");
})();
</script>
